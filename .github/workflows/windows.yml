# Builds the Windows launcher with MSYS2 and packs tux-mc-windows.zip.
# On every push it's an artifact of the run; when a release is published, the
# zip is attached to that release.
name: windows

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make zip gettext
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      - name: Build the launcher
        run: make -C launcher

      - name: Pack tux-mc-windows.zip
        run: bash windows/package.sh

      # the installer on a clean Windows, in Windows PowerShell 5.1 like users have it
      - name: Test install.ps1
        shell: pwsh
        run: |
          Expand-Archive dist/tux-mc-windows.zip -DestinationPath $env:RUNNER_TEMP/t
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP/t/tux-mc-windows/install.ps1" -NoSignIn -NoStart
          if ($LASTEXITCODE) { throw "install.ps1 failed" }
          $prism = Join-Path $env:LOCALAPPDATA 'tux-mc\prism'
          $need = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\tux-mc\bin\tux-mc.exe'),
            (Join-Path $prism 'prismlauncher.exe'),
            (Join-Path $prism 'instances\26.3\mmc-pack.json'),
            (Join-Path $prism 'instances\26.3\minecraft\mods\tuxmc.jar'),
            (Join-Path $prism 'themes\tux\theme.json')
          )
          foreach ($f in $need) { if (-not (Test-Path $f)) { throw "missing: $f" } else { "ok: $f" } }
          Get-ChildItem (Join-Path $prism 'instances\26.3\minecraft\mods') | Select-Object Name, Length
          Get-Content (Join-Path $prism 'prismlauncher.cfg')

      - uses: actions/upload-artifact@v4
        with:
          name: tux-mc-windows
          path: dist/tux-mc-windows.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tux-mc-windows.zip --clobber
